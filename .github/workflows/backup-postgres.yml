name: Validate Windows local backup scripts

# Solo datos ficticios. No programa ni conserva respaldos institucionales.
on:
  pull_request:
    paths:
      - 'scripts/*local*.ps1'
      - 'scripts/test-backup-local.ps1'
      - '.github/workflows/backup-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-local-procedure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test encrypted backup and disposable restore with fictional data
        shell: powershell
        run: ./scripts/test-backup-local.ps1
