
name: Deploy Inventario Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventario-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy fotografias-drive
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy fotografias-drive --project-ref bdtsevlgnwpduujcbatk --use-api

      - name: Deploy admin-eliminar-equipo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-eliminar-equipo --project-ref bdtsevlgnwpduujcbatk --use-api
